<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            border: 2px solid blue;
            display:inline;
            padding: 45px;
        }
    </style>
</head>
<body>
    <!-- seperate line -->
    <div class="box">
        I am box.
    </div>
    <!-- seperate line -->
    <div class="box">I am also nice Box.</div>

    <!-- both at smae line because span is inline element -->
    <span>I am good</span>
    <span>Man</span>
</body>
</html>
