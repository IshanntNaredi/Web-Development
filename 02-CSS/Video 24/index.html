<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>
    <style>
        .box {
            border : 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #888;
        }
        .text-element {
            text-shadow: 2px 2px 4px #873535;
        }
    </style>
</head>
<body>
    <div class="box">
        I am box. 
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique obcaecati temporibus harum sint, assumenda tenetur itaque doloremque aperiam vitae alias quaerat neque explicabo.
    </p>
</body>
</html>
