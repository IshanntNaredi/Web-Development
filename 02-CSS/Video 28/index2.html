<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position - absolute</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box1 {
            background-color: rgb(199, 154, 40);
            position: absolute;
            top:0px;
            left:3px;
        }
        .box2 {
            background-color: aqua;
            /* position:relative;
            top:34px;
            left:56px; */
        }
        .box3 {
            background-color: rgb(23, 164, 28);
        }
        .box4 {
            background-color: blueviolet;
        }
        .box {
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border:2px solid black;
        }
        .parent {
            position:absolute;
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
