<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS media query</title>
    <style>
        body {
            background-color: red;
        }

        @media screen and (orientation: landscape) {
            body {
                border: 12px solid rgb(227, 239, 9);
            }
        }

        @media only screen  and (max-width: 455px){
            body {
                background-color: rgb(34, 11, 185);
            }
            .boxes {
                flex-direction: column;
            }
        }
        /* @media not|only mediatype and (expressions) {
                CSS-Code; 
        } */

        .boxes {
            display : flex;
        }
        .box {
            width: 344px;
            height: 344px;
            background-color: aquamarine;
            padding: 3px;
            margin: 3px;
        }
    </style>
</head>
<body>
    <div>
        Hey I am a red body Guy!
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
