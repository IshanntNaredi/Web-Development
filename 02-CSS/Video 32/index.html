<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design</title>
    <style>
        body {
            background-color: grey;
        }
        .card {
            background-color: white;
            width:345px;
            height:460px;
            border-radius: 7px;
        }
        .image {
            padding: 10px;
            border-radius: 7px;
        }
        .capsules {
            padding : 0 12px;
        }
        .capsules span {
            border: 2px solid black;
            padding: 5px;
            border-radius: 10px;
            font-size:14px;
        }
        .content {
            padding: 7px;
        }
        .content p {
            font-size:13px;
        }
        .button  {
            text-align:center;
        }

        .button button {
            padding: 1px;
            border-radius:10px;
        }
    </style>
</head>
<body>
    <div class="card">
            <div class="image">
                <img width="325"  src="https://imgs.search.brave.com/njJ0RR6nn2grCw9e9oSzdf_lfkfIjRiHrqkEQwOMiTk/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90aHVt/YnMuZHJlYW1zdGlt/ZS5jb20vYi95b3Vu/Zy1tYW4tdG91cmlz/dC1zaXR0aW5nLWJv/dy1ib2F0LWxha2Ut/eW91bmctbWFuLXRv/dXJpc3Qtc2l0dGlu/Zy1ib3ctYm9hdC1s/YWtlLTE2NDE4MTcz/MC5qcGc" alt="">
            </div>
            <div class="capsules">
                <span>Nature</span>
                <span>Boat</span>
            </div>
            <div class="content">
                <h1>Travel and Enjoy</h1>
                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ipsa est mollitia, veniam voluptatibus voluptas doloribus veritatis, nostrum repudiandae reiciendis, voluptates tempora doloremque facere!</p>
            </div>
            <div class="button">
                <button>Submit</button>
            </div>
    </div>
</body>
</html>
