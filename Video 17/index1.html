<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Pseudo Selectors */
        a:visited{
            color: red;
        }
        a:link{
            color: blue;
        }
        a:active{
            background-color: yellow;
        }
        a:hover{
            background-color: lightgray;
        }
        p:first-child{
            background-color: red;
        }
    </style>
</head>
<body>
    <main class="one">
        <p>I first paragraph</p>
        <p>I am second paragraph</p>
    </main>
    <a href="http://www.gvfg.com">Go to GVFG</a>
    <a href="http://www.facebook.com">Go to Facebook</a>
    <div>
        I am a div
        <p>I am a paragraph inside the div</p>
    </div>

</body>
</html>
